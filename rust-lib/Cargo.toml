[package]
name = "zcash_node"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

# Standalone crate: keeps cargo from adopting a workspace in a parent directory.
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

# The librustzcash pre-release cohort pins its members exactly; same pins as the wallet core.
[dependencies]
zcash_client_backend = { version = "=0.25.0-pre.1", default-features = false, features = [
    "lightwalletd-tonic-transport",
    "lightwalletd-tonic-tls-webpki-roots",
] }
zcash_protocol = { version = "=0.11.0-pre.0", features = ["local-consensus"] }

# Network: gRPC over a socks5h connector.
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots", "codegen"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
tokio-socks = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
http = "1"

futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.10"
thiserror = "2"

# Provided by logos-module-builder at build time (staged into ../logos-rust-sdk-src).
logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk"]

[profile.release]
panic = "unwind"
